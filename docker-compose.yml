# docker-compose.yml
# Поле version не указываем: в Compose v2 оно устарело и игнорируется.
services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Версионированный тег вместо latest — понятно, что именно запущено.
    image: app-backend:1.0.0
    ports:
      # Наружу пробрасываем только порт приложения.
      - "${APP_PORT:-8080}:8080"
    environment:
      HTTP_PORT: "8080"
      STATIC_DIR: /app/static
      # Внутри сети Compose БД доступна по имени сервиса "db", а не по localhost.
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      # Секреты подтягиваются из .env (в git не коммитится).
      DB_USER: ${DB_USER:-app}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      DB_NAME: ${DB_NAME:-appdb}
    volumes:
      # Статичный фронт монтируем read-only: контейнер не может его изменить.
      - ./frontend:/app/static:ro
    depends_on:
      db:
        # Просто depends_on гарантирует порядок старта, но не готовность БД.
        # service_healthy ждёт, пока pg_isready в healthcheck вернёт успех.
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
      POSTGRES_DB: ${DB_NAME:-appdb}
    # ports НЕ указываем: 5432 доступен только внутри сети app_net.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-app} -d ${DB_NAME:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    volumes:
      # Именованный том — данные БД переживают пересоздание контейнера.
      - db_data:/var/lib/postgresql/data
      # SQL-скрипты первого запуска.
      - ./init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - app_net

volumes:
  db_data:

networks:
  app_net:
    driver: bridge
